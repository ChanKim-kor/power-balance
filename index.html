<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Power Balance | Chani Builds</title>
    </head>
    <body>    
        <h1>Power Balance</h1>
        <h2>How to Play</h2>
        <p>Keep electricity generation and demand balanced</p>
        <h2>Grid Status</h2>
        <p id="game-status">Grid Running</p>
        <p id="elapsed-time">Time: 0 s</p>
        <p id="score">Score: 0</p>
        <p id="generation">Generation: 80 MW</p>
        <p id="demand">Demand: 80 MW</p>
        <p id="balance">Balance: 0 MW</p>
        <p id="stability">Grid Stability: 100%</p>
        <h2>Generation Controls</h2>
        <button id="decrease-ten-button" type="button">Decrease by 10 MW</button>
        <button id="decrease-button" type="button">Decrease by 1 MW</button>
        <button id="increase-button" type="button">Increase by 1 MW</button>
        <button id="increase-ten-button" type="button">Increase by 10 MW</button>
        <button id="restart-button" type="button">RESTART</button>
        <script src="script.js"></script>
    </body>
</html>
